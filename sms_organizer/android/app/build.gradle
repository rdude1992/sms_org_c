plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "0.1.0"

android {
    // Must match the package of the Kotlin sources (com/smsorganizer/app) so
    // manifest component names (.MainActivity etc.) and the generated R class
    // resolve correctly. This is independent of applicationId, which stays
    // stable because Android's default-SMS-handler role is bound to it.
    namespace "com.smsorganizer.app"
    // permission_handler 13.0.0 requires compileSdk 37 (was 35 pre-12.0.0) —
    // see its CHANGELOG.
    compileSdk 37
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // Must stay stable once you've set the app as default SMS handler on a
        // test device; changing it later means re-registering the role.
        applicationId "com.smartsms.app"
        // local_auth (Insights biometric lock) requires API 23+ — its plugin
        // manifest declares that floor, so building against
        // flutter.minSdkVersion alone would fail manifest merging if that
        // resolves lower.
        minSdkVersion Math.max(flutter.minSdkVersion, 23)
        targetSdkVersion 37
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // TODO: replace with your own signing config before a real release build.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
}
