plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

// Release signing: android/key.properties (git-ignored) is written by the
// GitHub Actions workflow from repository secrets, or by hand for a local
// release build. See README "CI & releases".
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}
// Set by CI when building a release tag: a release APK must never silently
// fall back to the debug key.
def requireReleaseSigning = System.getenv("CI_REQUIRE_RELEASE_SIGNING") == "true"

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "0.1.0"

android {
    // Must match the package of the Kotlin sources (com/smsorganizer/app) so
    // manifest component names (.MainActivity etc.) and the generated R class
    // resolve correctly. This is independent of applicationId, which stays
    // stable because Android's default-SMS-handler role is bound to it.
    namespace "com.smsorganizer.app"
    // permission_handler 13.0.0 requires compileSdk 37 (was 35 pre-12.0.0) —
    // see its CHANGELOG.
    compileSdk 37
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        // Must stay stable once you've set the app as default SMS handler on a
        // test device; changing it later means re-registering the role.
        applicationId "com.smartsms.app"
        // local_auth (Insights biometric lock) requires API 23+ — its plugin
        // manifest declares that floor, so building against
        // flutter.minSdkVersion alone would fail manifest merging if that
        // resolves lower.
        minSdkVersion Math.max(flutter.minSdkVersion, 23)
        targetSdkVersion 37
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else if (requireReleaseSigning) {
                throw new GradleException(
                    "CI_REQUIRE_RELEASE_SIGNING is set but android/key.properties is missing — " +
                    "refusing to produce a debug-signed release build.")
            } else {
                // Local/preview builds only — not installable over a properly
                // signed release.
                signingConfig signingConfigs.debug
            }
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    testImplementation "junit:junit:4.13.2"
}
