name: sms_organizer
description: SmartSMS — smart SMS organiser with categorisation, expense & investment insights.
publish_to: 'none'
version: 2.1.3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  permission_handler: ^13.0.0
  intl: ^0.20.3
  fl_chart: ^1.2.0
  share_plus: ^13.3.0
  path_provider: ^2.1.4
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_slidable: ^4.0.3
  file_selector: ^1.0.3
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.3.1
  local_auth: ^3.0.2
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
        - asset: assets/fonts/Inter-Italic-Variable.ttf
          style: italic
