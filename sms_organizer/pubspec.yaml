name: sms_organizer
description: Smart SMS organiser with categorisation, expense & investment insights.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  permission_handler: ^11.3.1
  intl: ^0.19.0
  fl_chart: ^0.68.0
  share_plus: ^7.2.2
  path_provider: ^2.1.4
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_slidable: ^3.1.1
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
