name: Android build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sms_organizer
    env:
      # On a release tag the Gradle build refuses to fall back to the debug
      # key — a debug-signed APK must never be published as a release.
      CI_REQUIRE_RELEASE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "flutter.sdk=$FLUTTER_ROOT"
          } > android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Dart tests
        run: flutter test

      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "No signing secrets available — release APK will be debug-signed (preview only)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APKs (per ABI)
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Build release APK (universal)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Kotlin unit tests
        working-directory: sms_organizer/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Collect APKs
        run: |
          mkdir -p dist
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          SUFFIX=""
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then SUFFIX="-unsigned-preview"; fi
          for f in build/app/outputs/flutter-apk/app-*-release.apk build/app/outputs/flutter-apk/app-release.apk; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .apk | sed "s/^app/smartsms-$VERSION/; s/-release//")
            cp "$f" "dist/${name}${SUFFIX}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: smartsms-apks${{ steps.signing.outputs.signed != 'true' && '-unsigned-preview' || '' }}
          path: sms_organizer/dist/
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — refusing to publish a debug-signed release."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: smartsms-apks
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
