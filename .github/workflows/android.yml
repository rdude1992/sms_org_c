name: Android build

# Every push and PR builds signed APKs. A push to main whose pubspec.yaml
# version has no Release yet also publishes one (tag v<version>, created by
# GitHub on the built commit), so a release is just "bump the version, merge".
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sms_organizer
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    env:
      # On main the Gradle build refuses to fall back to the debug key, so a
      # debug-signed APK can never be published as a release.
      CI_REQUIRE_RELEASE_SIGNING: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Decide whether this push is a release
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          SHOULD_RELEASE=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "v$VERSION is already released; building only. Bump version: in pubspec.yaml to release."
            else
              SHOULD_RELEASE=true
              echo "Will publish release v$VERSION."
            fi
          fi
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Pinned rather than floating on "stable": a new stable can raise the
      # minimum Gradle/AGP versions overnight (3.50 requires AGP 9) and break
      # the build. Bump this deliberately, together with android/ tooling.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "flutter.sdk=$FLUTTER_ROOT"
          } > android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Dart tests
        run: flutter test

      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "No signing secrets available — release APK will be debug-signed (preview only)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APKs (per ABI)
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Build release APK (universal)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Kotlin unit tests
        working-directory: sms_organizer/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Collect APKs
        run: |
          mkdir -p dist
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          SUFFIX=""
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then SUFFIX="-unsigned-preview"; fi
          for f in build/app/outputs/flutter-apk/app-*-release.apk build/app/outputs/flutter-apk/app-release.apk; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .apk | sed "s/^app/smartsms-$VERSION/; s/-release//")
            cp "$f" "dist/${name}${SUFFIX}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: smartsms-apks${{ steps.signing.outputs.signed != 'true' && '-unsigned-preview' || '' }}
          path: sms_organizer/dist/
          if-no-files-found: error
          retention-days: 30

  release:
    if: needs.build.outputs.should_release == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — refusing to publish a debug-signed release."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: smartsms-apks
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: SmartSMS ${{ needs.build.outputs.version }}
          # The tag doesn't exist yet; it is created on exactly the commit
          # this run built and tested.
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
